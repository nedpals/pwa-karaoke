services:
  karaoke-app:
    build: .
    restart: unless-stopped
    environment:
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - KARAOKE_DOMAIN=${KARAOKE_DOMAIN:-localhost}
      # Reported on /heartbeat so a display opened at localhost can still show
      # phones an address they can reach.
      - KARAOKE_LAN_IP=${KARAOKE_LAN_IP:-127.0.0.1}
      - KARAOKE_DATA_DIR=/app/data
      # Refresh yt-dlp on every start so a restart is enough to pick up a new
      # release. Set to 0 to stay on whatever the image was built with.
      - YTDLP_AUTO_UPDATE=${YTDLP_AUTO_UPDATE:-1}
      # stable or nightly. Nightly builds pick up YouTube fixes before a
      # stable release does.
      - YTDLP_CHANNEL=${YTDLP_CHANNEL:-stable}
      - YTDLP_TIMEOUT_SECONDS=${YTDLP_TIMEOUT_SECONDS:-45}
      - YTDLP_EXTRA_ARGS=${YTDLP_EXTRA_ARGS:-}
      - YTDLP_RUNTIME=${YTDLP_RUNTIME:-deno}
      # Empty leaves the choice of YouTube player clients to yt-dlp.
      - YTDLP_PLAYER_CLIENT=${YTDLP_PLAYER_CLIENT:-}
    volumes:
      - karaoke_data:/app/data
    # Port 8000 is internal only - accessed via Caddy reverse proxy
    # Uncomment the ports section below for development/debugging
    # ports:
    #   - "8000:8000"
    # Health check for the karaoke app
    healthcheck:
      # The image has no curl, so use Python. urlopen raises on a 503.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      # Check often while starting so Caddy is not held back for a full interval.
      start_interval: 2s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Wait for the app so early requests don't get a 502 while it starts.
    depends_on:
      karaoke-app:
        condition: service_healthy
    # KARAOKE_HTTP_PORT sets the host port for plain HTTP (default 80). HTTPS stays on 443.
    ports:
      - "${KARAOKE_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - KARAOKE_DOMAIN=${KARAOKE_DOMAIN:-localhost}
      - KARAOKE_LAN_IP=${KARAOKE_LAN_IP:-127.0.0.1}

# Optional: Create a custom network for better isolation
networks:
  default:
    name: karaoke-network

volumes:
  karaoke_data:
  caddy_data:
  caddy_config:
