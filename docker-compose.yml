services:
  karaoke-app:
    build: .
    restart: unless-stopped
    environment:
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - DOMAIN=${DOMAIN:-localhost}
      # Refresh yt-dlp on every start so a restart is enough to pick up a new
      # release. Set to 0 to stay on whatever the image was built with.
      - YTDLP_AUTO_UPDATE=${YTDLP_AUTO_UPDATE:-1}
      - YTDLP_TIMEOUT_SECONDS=${YTDLP_TIMEOUT_SECONDS:-45}
      - YTDLP_EXTRA_ARGS=${YTDLP_EXTRA_ARGS:-}
      # Decides which formats YouTube returns. Playback needs a progressive one
      # and most clients no longer offer any; an unknown name here is skipped
      # silently rather than refused. See the backend README before changing it.
      - YTDLP_PLAYER_CLIENT=${YTDLP_PLAYER_CLIENT:-android}
      # The JS runtime the image installs. yt-dlp enables only deno by default,
      # so without naming it here Bun sits unused and formats go missing.
      - YTDLP_RUNTIME=${YTDLP_RUNTIME:-bun}
      # Keep a copy of each video that plays, so a song that has played once
      # keeps playing when YouTube stops answering. Off by default: it stores
      # copies of what you play, which is your call rather than a default.
      - ARCHIVE_ENABLED=${ARCHIVE_ENABLED:-0}
      - ARCHIVE_MAX_BYTES=${ARCHIVE_MAX_BYTES:-21474836480}
      # Set this to keep already-issued media URLs valid across a restart.
      - ARCHIVE_URL_SECRET=${ARCHIVE_URL_SECRET:-}
    volumes:
      # The archive is only as durable as what it is written to. Without this
      # the copies die with the container.
      - karaoke_media:/app/media_archive
    # Port 8000 is internal only - accessed via Caddy reverse proxy
    # Uncomment the ports section below for development/debugging
    # ports:
    #   - "8000:8000"
    # Health check for the karaoke app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}

# Optional: Create a custom network for better isolation
networks:
  default:
    name: karaoke-network

volumes:
  caddy_data:
  caddy_config:
  karaoke_media:
