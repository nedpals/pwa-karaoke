services:
  karaoke-app:
    build: .
    restart: unless-stopped
    environment:
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - DOMAIN=${DOMAIN:-localhost}
      # Refresh yt-dlp on every start so a restart is enough to pick up a new
      # release. Set to 0 to stay on whatever the image was built with.
      - YTDLP_AUTO_UPDATE=${YTDLP_AUTO_UPDATE:-1}
      - YTDLP_TIMEOUT_SECONDS=${YTDLP_TIMEOUT_SECONDS:-45}
      - YTDLP_EXTRA_ARGS=${YTDLP_EXTRA_ARGS:-}
      # Reached over the internal network, so requests skip the reverse proxy.
      - COBALT_API_URL=http://cobalt:9000/
      - COBALT_VIDEO_QUALITY=${COBALT_VIDEO_QUALITY:-720}
      # Must match cobalt's own API_URL, or tunnels are refused rather than
      # handed to a browser that cannot fetch them.
      - COBALT_PUBLIC_URL=${COBALT_PUBLIC_URL:-http://localhost/cobalt/}
    depends_on:
      - cobalt
    # Port 8000 is internal only - accessed via Caddy reverse proxy
    # Uncomment the ports section below for development/debugging
    # ports:
    #   - "8000:8000"
    # Health check for the karaoke app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Second extractor, used only when yt-dlp fails to resolve a video.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      # Tunnel URLs are built from this and then fetched by the browser, so it
      # has to be the address a browser can reach rather than the internal one.
      # Only /tunnel is published; the API itself stays on the internal network.
      - API_URL=${COBALT_PUBLIC_URL:-http://localhost/cobalt/}
      - YOUTUBE_SESSION_SERVER=http://yt-session-generator:8080/token
    expose:
      - "9000"
    depends_on:
      - yt-session-generator

  # Supplies cobalt with poToken and visitor_data. YouTube refuses cobalt
  # without them.
  yt-session-generator:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    restart: unless-stopped
    init: true
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}

# Optional: Create a custom network for better isolation
networks:
  default:
    name: karaoke-network

volumes:
  caddy_data:
  caddy_config:
